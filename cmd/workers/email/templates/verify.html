<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Verify your email</title>
</head>

<body
	style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
	<h2>Welcome, {{.Name}}!</h2>
	<p>Thanks for signing up. Please verify your email address by clicking the button below:</p>

	<p style="text-align: center; margin: 30px 0;">
		<a href="{{.VerifyURL}}"
			style="background-color: #4F46E5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: 600;">
			Verify Email
		</a>
	</p>

	<p>Or copy and paste this link into your browser:</p>
	<p style="word-break: break-all; color: #666;">{{.VerifyURL}}</p>

	<p style="color: #888; font-size: 14px;">
		This link will expire in {{.ExpiresIn}}.<br>
		If you didn’t create an account, you can safely ignore this email.
	</p>
</body>

</html>
